- name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          buildozer android update || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" || true
            rm -rf "$SDK/build-tools/37.0.0" || true
          fi
          buildozer -v android debug | tee "$GITHUB_WORKSPACE/buildozer-out.txt"
