name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" buildozer virtualenv
      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          buildozer android update || true
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" || true
            rm -rf "$SDK/build-tools/37.0.0" || true
          fi
          buildozer -v android debug | tee "$GITHUB_WORKSPACE/buildozer-out.txt"
      - name: Upload APK or logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuantumMind-build
          path: |
            app/bin/*.apk
            buildozer-out.txt
