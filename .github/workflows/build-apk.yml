name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with official Buildozer
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/app":/home/user/hostcwd \
            kivy/buildozer:latest \
            android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumMind-APK
          path: app/bin/*.apk
