name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

     - name: Build APK
       uses: digreatbrian/buildozer-action@v2
       with:
          python-version: "3.11"
          buildozer-cmd: cd app && yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantumMind-APK
          path: app/bin/*.apk
