<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Talk — Quantum Mind</title>
  <link rel="icon" href="/assets/core.jpg" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/talk.css" />
</head>
<body class="talk-body">
  <div class="face-bg"></div>
  <aside id="menu" class="qm-menu" hidden>
    <p class="menu-title">Quantum Mind</p>
    <button type="button" data-act="new">New chat</button>
    <button type="button" data-mode="general">General</button>
    <button type="button" data-mode="study">Study</button>
    <button type="button" data-mode="coding">Coding</button>
    <p class="menu-label">Projects</p>
    <div id="projects"></div>
    <button type="button" data-act="project">Add project</button>
    <p class="menu-label">Settings</p>
    <button type="button" data-act="voice">Voice on</button>
    <a href="/">Home</a>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <header class="nav talk-nav">
    <button id="menuBtn" class="icon-btn" type="button">☰</button>
    <a class="brand" href="/talk.html">QUANTUM MIND</a>
    <button id="modeBtn" class="icon-btn" type="button">◈</button>
  </header>
  <main class="talk-main talk-main-only">
    <p id="key-status" class="status">Checking core…</p>
    <div id="log" class="log"></div>
    <p id="hints" class="hints-line"></p>
    <div class="composer-wrap">
      <div id="plusMenu" class="plus-menu" hidden>
        <button type="button" id="mic">Mic</button>
        <button type="button" id="camBtn">Camera</button>
        <button type="button" id="galBtn">Gallery</button>
        <button type="button" id="fileBtn">Files</button>
      </div>
      <form id="ask" class="composer">
        <button id="plusBtn" class="icon-btn" type="button">+</button>
        <input id="q" type="text" maxlength="2000" placeholder="Message Quantum Mind" />
        <button class="icon-btn send-btn" type="submit">➤</button>
      </form>
    </div>
    <input id="camInput" type="file" accept="image/*" capture="environment" hidden />
    <input id="galInput" type="file" accept="image/*" hidden />
    <input id="fileInput" type="file" accept="image/*,.txt,.md,.csv" hidden />
  </main>
  <script src="/talk.js"></script>
</body>
</html>
