<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Talk — Quantum Mind</title>
  <link rel="icon" href="/assets/core.jpg" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/talk.css" />
</head>
<body class="talk-body">
  <aside id="menu" class="qm-menu" hidden>
    <p class="menu-title">Quantum Mind</p>
    <button type="button" data-act="new">New chat</button>
    <button type="button" data-mode="general">General</button>
    <button type="button" data-mode="study">Study</button>
    <button type="button" data-mode="coding">Coding mode</button>
    <p class="menu-label">Projects</p>
    <div id="projects"></div>
    <button type="button" data-act="project">Add project</button>
    <p class="menu-label">Settings</p>
    <button type="button" data-act="voice">Voice on</button>
    <a href="/">Home</a>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <header class="nav talk-nav">
    <button id="menuBtn" class="icon-btn" type="button">Menu</button>
    <a class="brand" href="/talk.html">QUANTUM MIND</a>
    <span id="modeTag" class="mode-tag">General</span>
  </header>
  <main class="talk-main talk-main-only">
    <p id="key-status" class="status">Checking core…</p>
    <div id="log" class="log"></div>
    <div id="hints" class="hints"></div>
    <form id="ask" class="ask composer">
      <button id="mic" class="btn ghost" type="button">Mic</button>
      <input id="q" type="text" maxlength="2000" placeholder="Message Quantum Mind" required />
      <button class="btn primary" type="submit">Send</button>
    </form>
  </main>
  <script src="/talk.js"></script>
</body>
</html>
